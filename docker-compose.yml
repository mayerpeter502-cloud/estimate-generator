version: "3.9"

services:
  backend:
    build: ./backend
    container_name: smeta-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/output
      - db_file:/app
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/estimates.db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    container_name: smeta-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
  db_file: